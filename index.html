<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal academic homepage of Zhiyang Wang, Sun Yat-sen University.">
  <title>Zhiyang Wang | Academic Homepage</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202938;
      --muted: #5c6675;
      --accent: #8f2118;
      --line: #e5e7eb;
      --paper: #ffffff;
      --soft: #f7f8fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--soft);
      color: var(--ink);
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(860px, calc(100% - 32px));
      margin: 56px auto;
      padding: clamp(24px, 5vw, 52px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(25, 35, 50, .05);
    }
    .eyebrow {
      color: var(--accent);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0 0;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      line-height: 1.15;
      letter-spacing: -.04em;
    }
    .affiliation { margin: 12px 0 0; color: var(--muted); font-size: 1.08rem; }
    .rule { height: 1px; background: var(--line); margin: 30px 0; }
    h2 { margin: 0 0 8px; font-size: 1.15rem; }
    p { margin: 0 0 12px; }
    a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
    .note { color: var(--muted); }
    footer { margin-top: 36px; color: var(--muted); font-size: .88rem; }
    @media (max-width: 520px) {
      main { margin: 20px auto; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Academic Homepage</div>
    <h1>Zhiyang Wang</h1>
    <p class="affiliation">Sun Yat-sen University</p>

    <div class="rule"></div>

    <section aria-labelledby="about-heading">
      <h2 id="about-heading">About</h2>
      <p>
        Affiliated with Sun Yat-sen University.
      </p>
    </section>

    <div class="rule"></div>

    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact</h2>
      <p>Email: <a href="mailto:wangzhy286@mail2.sysu.edu.cn">wangzhy286@mail2.sysu.edu.cn</a></p>
    </section>

    <footer>
      This page is maintained by Zhiyang Wang.
    </footer>
  </main>
</body>
</html>
